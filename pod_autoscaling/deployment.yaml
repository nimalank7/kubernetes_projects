apiVersion: v1
kind: Service
metadata:
  name: go-application
  labels:
    app: go-application
spec:
  type: ClusterIP
  selector:
    app: go-application
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-application
  labels:
    app: go-application
spec:
  selector:
    matchLabels:
      app: go-application
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: go-application
    spec:
      containers:
      - name: go-application
        image: go-application:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: 50Mi
            cpu: 500m
          limits:
            memory: 500Mi
            cpu: 2000m
