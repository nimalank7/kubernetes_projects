# repoURL is the application URL that contains the deployment YAML for our application
# targetRevision is of course the pointer
# path is any subdirectory inside our Git repository
# destination.server is the URL of the kubernetes cluster
# Since ArgoCD is running inside the cluster itself we can put a DNS name 'kubernetes.default.svc'
# which K8s will resolve to the cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argo-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/nanuchi/argocd-app-config.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true