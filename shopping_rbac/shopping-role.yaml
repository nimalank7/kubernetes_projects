apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: shopping
  name: managed-pods
rules:
  - apiGroups: [""] # Blank API group for pods
    resources: ["pods", "pods/exec"]
    verbs: ["get", "watch", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "watch", "list", "delete", "create"]