apiVersion: batch/v1
kind: Job
metadata:
  name: example-job
spec:
  # Job is successful if at least 1 pod is successful (and so how many pods are created by the Job)
  completions: 1
  # Maximum number of pods to run in parallel
  parallelism: 1
  # Number of retries before the Job is failed
  backoffLimit: 4
  template:
    metadata:
      name: example-job-pod
    spec:
      containers:
      - name: example
        image: busybox
        command: ["sh", "-c", "echo Hello, Kubernetes! && sleep 10"]
      restartPolicy: Never
